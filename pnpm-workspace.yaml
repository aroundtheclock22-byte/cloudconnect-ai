packages:
  - "packages/*"
  - "apps/api"
  - "apps/web"
# apps/mobile and apps/desktop are built with their own toolchains (EAS / electron-builder)
onlyBuiltDependencies:
  - bcrypt
  - "@nestjs/core"
  - esbuild
# Security overrides for transitive deps pinned by frameworks (same major; re-check when upgrading Next/Nest)
overrides:
  multer: ^2.5.0
  postcss: ^8.5.18
