# Local full stack: docker compose up --build   →  web http://localhost:8080  ·  API docs http://localhost:8080/docs
name: cloudconnect
x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://cloudconnect:cloudconnect@postgres:5432/cloudconnect
  REDIS_URL: redis://redis:6379
  ELASTICSEARCH_URL: http://elasticsearch:9200
  PUBLIC_URL: http://localhost:8080
  WEB_URL: http://localhost:8080
  CORS_ORIGINS: http://localhost:8080
  JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-6b1f1d2a0e5c4b3a29181716151413121110090807060504030201000f0e0d0c}
  TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-mock}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  LIVEKIT_URL: ws://localhost:7880
  LIVEKIT_API_KEY: devkey
  LIVEKIT_API_SECRET: devsecret-devsecret-devsecret-00

services:
  postgres:
    image: postgres:16.6-alpine
    environment: { POSTGRES_USER: cloudconnect, POSTGRES_PASSWORD: cloudconnect, POSTGRES_DB: cloudconnect }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cloudconnect"], interval: 5s, retries: 10 }
    ports: ["5432:5432"]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s }
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.1
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
    volumes: [esdata:/usr/share/elasticsearch/data]
  livekit:
    image: livekit/livekit-server:v1.8.2
    command: ["--dev", "--bind", "0.0.0.0"]
    ports: ["7880:7880", "7881:7881", "50000-50100:50000-50100/udp"]
  migrate:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    command: ["node", "scripts/migrate.js"]
    environment: *api-env
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    environment: *api-env
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    deploy: { replicas: 2 }
  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile, args: { NEXT_PUBLIC_WS_URL: "http://localhost:8080" } }
    environment: { API_URL: http://api:4000 }
    depends_on: [api]
  nginx:
    image: nginx:1.27-alpine
    volumes: ["./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    depends_on: [api, web]
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes: ["./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["9090:9090"]
    profiles: [monitoring]
  grafana:
    image: grafana/grafana:11.4.0
    volumes: ["./infra/monitoring/grafana:/etc/grafana/provisioning/dashboards:ro"]
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true" }
    ports: ["3001:3000"]
    profiles: [monitoring]
volumes: { pgdata: {}, esdata: {} }
