# Edge config for compose / self-hosted. In AWS, Cloudflare → ALB → ingress-nginx applies the same rules.
worker_processes auto;
events { worker_connections 4096; }
http {
  server_tokens off;
  client_max_body_size 25m;
  log_format json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method","u":"$uri","s":$status,"rt":$request_time,"ua":"$http_user_agent"}';
  access_log /dev/stdout json;

  limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream api { least_conn; server api:4000 max_fails=3 fail_timeout=10s; keepalive 64; }
  upstream web { server web:3000; keepalive 32; }

  server {
    listen 80;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /v1/auth/ { limit_req zone=auth burst=20 nodelay; proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /v1/telephony/ { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }   # carrier webhooks: signature-verified upstream
    location ~ ^/(v1|graphql|docs|openapi.json) { limit_req zone=api burst=100 nodelay; proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /ws { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 1h; }
    location ~ ^/(metrics|health) { allow 10.0.0.0/8; allow 172.16.0.0/12; allow 127.0.0.1; deny all; proxy_pass http://api; }
    location / { proxy_pass http://web; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
