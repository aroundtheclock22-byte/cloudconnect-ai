apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudconnect-staging
resources: [../../base]
images:
  - { name: ghcr.io/cloudconnect-ai/api, newTag: IMAGE_TAG }
  - { name: ghcr.io/cloudconnect-ai/web, newTag: IMAGE_TAG }
patches:
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 2 }
      - { op: replace, path: /spec/maxReplicas, value: 6 }
  - target: { kind: Deployment }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 2 }
