apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - { name: ghcr.io/cloudconnect-ai/api, newTag: IMAGE_TAG }
  - { name: ghcr.io/cloudconnect-ai/web, newTag: IMAGE_TAG }
patches:
  - target: { kind: ServiceAccount, name: cloudconnect-api }
    patch: |-
      - { op: replace, path: /metadata/annotations/eks.amazonaws.com~1role-arn, value: "arn:aws:iam::ACCOUNT_ID:role/cloudconnect-api-eu-west-1" }
  - target: { kind: ConfigMap, name: cloudconnect-config }
    patch: |-
      - { op: add, path: /data/AWS_REGION, value: eu-west-1 }
      - { op: add, path: /data/PUBLIC_URL, value: "https://api.cloudconnect.ai" }
      - { op: add, path: /data/WEB_URL, value: "https://app.cloudconnect.ai" }
      - { op: add, path: /data/CORS_ORIGINS, value: "https://app.cloudconnect.ai" }
      - { op: add, path: /data/S3_BUCKET, value: "cloudconnect-media-eu-west-1" }
