# Launch pipeline: CI green on main → deploy staging → smoke + Playwright e2e against staging → (approval) → production.
name: Railway
on:
  workflow_run: { workflows: [CI], types: [completed], branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
env:
  RAILWAY_PROJECT_ID: ce6f9835-ae8d-43f2-9fa6-52a01d867914
  RAILWAY_API_SERVICE_ID: 9cef1dd7-9b0b-4f30-a73d-d57638ced3e2
  RAILWAY_WEB_SERVICE_ID: a4ba9790-e267-4829-8b0e-6a1de36b9a3a
  STAGING_ENV_ID: 6f1eb45b-c78c-49ba-a73f-e3ace33866e4
  PRODUCTION_ENV_ID: 669e5b21-1ebb-49de-a986-9873860bd82d
  STAGING_API_URL: https://api-staging-ae0c.up.railway.app
  STAGING_WEB_URL: https://web-staging-4270.up.railway.app
  PRODUCTION_API_URL: https://api-production-f43f6.up.railway.app
  PRODUCTION_WEB_URL: https://web-production-0cf2f5.up.railway.app
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  staging:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: { name: staging, url: "https://web-staging-4270.up.railway.app" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - name: Deploy API (pre-deploy runs migrations + demo seed)
        run: infra/railway/deploy.sh $RAILWAY_PROJECT_ID $STAGING_ENV_ID $RAILWAY_API_SERVICE_ID
      - name: Deploy web
        run: infra/railway/deploy.sh $RAILWAY_PROJECT_ID $STAGING_ENV_ID $RAILWAY_WEB_SERVICE_ID
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -fsS "$STAGING_API_URL/health/ready" && break; sleep 10; done
          curl -fsS "$STAGING_API_URL/health/ready"
          curl -fsS -o /dev/null "$STAGING_WEB_URL/login"
          curl -fsS "$STAGING_WEB_URL/v1/billing/plans" | grep -q '"starter"'

  e2e-staging:
    needs: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @cloudconnect/web
      - run: cd apps/web && npx playwright install --with-deps chromium
      - run: cd apps/web && npx playwright test --trace off
        env: { E2E_BASE_URL: "https://web-staging-4270.up.railway.app", CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-staging, path: apps/web/playwright-report }

  production:
    needs: e2e-staging
    runs-on: ubuntu-latest
    environment: { name: production, url: "https://web-production-0cf2f5.up.railway.app" }   # add required reviewers to gate launches
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - run: infra/railway/deploy.sh $RAILWAY_PROJECT_ID $PRODUCTION_ENV_ID $RAILWAY_API_SERVICE_ID
      - run: infra/railway/deploy.sh $RAILWAY_PROJECT_ID $PRODUCTION_ENV_ID $RAILWAY_WEB_SERVICE_ID
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -fsS "$PRODUCTION_API_URL/health/ready" && break; sleep 10; done
          curl -fsS "$PRODUCTION_API_URL/health/ready"
          curl -fsS -o /dev/null "$PRODUCTION_WEB_URL/login"
