name: CI
on:
  pull_request:
  push: { branches: [main] }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cloudconnect, POSTGRES_PASSWORD: cloudconnect, POSTGRES_DB: cloudconnect_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cloudconnect" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cloudconnect/shared build
      - name: Typecheck
        run: pnpm lint
      - name: Unit tests (shared + api)
        run: pnpm test
      - name: Integration tests (real Postgres)
        run: pnpm test:integration
        env: { TEST_DATABASE_URL: postgres://cloudconnect:cloudconnect@localhost:5432/cloudconnect_test }

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cloudconnect, POSTGRES_PASSWORD: cloudconnect, POSTGRES_DB: cloudconnect }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cloudconnect" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cloudconnect:cloudconnect@localhost:5432/cloudconnect
      AUTH_RATE_LIMIT: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate && pnpm db:seed
      - run: (node apps/api/dist/main.js &) && (cd apps/web && npx next start -p 3000 &) && npx wait-on -t 60000 http://localhost:4000/health/ready http://localhost:3000/login
      - run: cd apps/web && npx playwright install --with-deps chromium && npx playwright test --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }

  security:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with: { scan-type: fs, severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform fmt -check -recursive infra/terraform
      - run: cd infra/terraform/envs/production && terraform init -backend=false && terraform validate
      - run: kubectl kustomize infra/k8s/overlays/production-us-east-1 > /dev/null && kubectl kustomize infra/k8s/overlays/staging > /dev/null

  images:
    if: github.ref == 'refs/heads/main'
    needs: [test, e2e, security, iac]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    strategy: { matrix: { app: [api, web] } }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:${{ github.sha }}
